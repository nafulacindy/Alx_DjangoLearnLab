{% extends "blog/base.html" %}
{% block content %}
  <h2>All Posts</h2>
  {% for post in posts %}
    <article>
      <h3><a href="{% url 'post_detail' post.pk %}">{{ post.title }}</a></h3>
      <p>{{ post.content|truncatewords:30 }}</p>
      <small>by {{ post.author }} on {{ post.created_at }}</small>
    </article>
    <hr>
  {% empty %}
    <p>No posts yet.</p>
  {% endfor %}
{% endblock %}
